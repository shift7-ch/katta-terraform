name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/terraform-validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
